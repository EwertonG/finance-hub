name: Keep API awake

on:
  schedule:
    - cron: '*/10 10-23,0-2 * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://finance-hub-api-a6y4.onrender.com/health
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            "$HEALTH_URL"
